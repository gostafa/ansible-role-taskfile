name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install Ansible tooling
        run: python -m pip install --upgrade pip -r requirements-ci.txt

      - name: Ansible lint
        run: ansible-lint .

      - name: Syntax check
        run: ansible-playbook -i tests/inventory tests/test.yml --syntax-check
